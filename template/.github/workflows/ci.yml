name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.15"
  UV_VERSION: "0.12.7"

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: uv sync --locked --dev
      - name: Run independent tests
        run: uv run --locked --no-sync pytest -q --ignore=tests/test_integration.py --junitxml=test_logs/junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: test_logs/junit.xml
          retention-days: 7
          if-no-files-found: warn

  integration:
    name: CFMS integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out extension
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve CFMS version
        id: cfms
        uses: ./.github/actions/resolve-cfms

      - name: Check out CFMS ${{ steps.cfms.outputs.ref }}
        uses: actions/checkout@v7
        with:
          repository: cfms-dev/cfms_on_websocket
          ref: ${{ steps.cfms.outputs.ref }}
          path: .ci/cfms
          submodules: recursive
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: .ci/cfms/uv.lock

      - name: Install CFMS test dependencies
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: uv sync --project .ci/cfms --locked --dev

      - name: Run real-server integration test
        env:
          CFMS_SOURCE: ${{ github.workspace }}/.ci/cfms
        run: >-
          uv run --project .ci/cfms --locked --no-sync python -m pytest
          "${GITHUB_WORKSPACE}/tests/test_integration.py" -q
          --junitxml="${GITHUB_WORKSPACE}/test_logs/integration-junit.xml"

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-cfms-${{ steps.cfms.outputs.version }}
          path: test_logs/integration-junit.xml
          retention-days: 7
          if-no-files-found: warn
